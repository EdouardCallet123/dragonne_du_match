<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metz Handball</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            /* Le vrai bleu foncé du club */
            background-color: #110b29; 
            /* Si tu as l'image de fond avec les dragons, décommente la ligne dessous : */
            /* background-image: url('img/pattern.png'); background-size: cover; */
            font-family: 'Bebas Neue', sans-serif; /* La police sport par excellence */
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- LOGO --- */
        .logo-area {
            margin-top: 30px;
            margin-bottom: 40px;
            text-align: center;
        }
        .logo-img {
            width: 140px; /* Taille ajustée */
            filter: drop-shadow(0 0 15px rgba(255,236,0, 0.2)); /* Petite lueur jaune subtile */
        }

        /* --- LE MENU --- */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espace vertical entre les lignes */
            width: 100%;
        }

        /* Liens (Boutons) */
        .btn-link {
            text-decoration: none;
            display: block;
            width: 100%;
        }

        /* Forme du bouton (Le parallélogramme) */
        .shape {
            height: 65px; /* Hauteur fixe pour ressembler à l'appli */
            display: flex;
            align-items: center; /* Centre le texte verticalement */
            justify-content: center; /* Centre le texte horizontalement */
            transform: skewX(-20deg); /* L'angle agressif (-20 degrés) */
            border-radius: 4px;
            transition: transform 0.1s, filter 0.1s;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.3); /* Ombre dure pour l'effet sticker */
        }

        /* Le texte à l'intérieur (on annule l'inclinaison) */
        .shape span {
            transform: skewX(20deg); /* On redresse le texte */
            font-size: 26px; /* Texte GROS */
            letter-spacing: 1px;
            color: #110b29; /* Bleu foncé pour le texte */
            text-align: center;
            line-height: 1;
            padding-top: 4px; /* Petit ajustement optique pour cette police */
        }

        /* --- COULEURS --- */
        .bg-white { background-color: white; }
        .bg-yellow { background-color: #ffec00; } /* Le jaune officiel vif */

        /* --- INTERACTION --- */
        .shape:active {
            transform: skewX(-20deg) scale(0.98) translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            filter: brightness(0.95);
        }

        /* --- LIGNES SPÉCIALES (2 BOUTONS) --- */
        .row-split {
            display: flex;
            width: 100%;
            gap: 15px; /* L'espace entre les deux morceaux */
            padding: 0 10px; /* Pour éviter que les pointes touchent le bord */
        }

        /* Gestion des largeurs spécifiques */
        /* Pour "JEU - MI TEMPS" (Large à gauche) + "CLUB" (Court à droite) */
        .w-60 { flex: 6; } 
        .w-40 { flex: 4; }

        /* Pour "VOTEZ" (Court à gauche) + "BILLETTERIE" (Large à droite) */
        .w-35 { flex: 3.5; }
        .w-65 { flex: 6.5; }

        .heart { color: #e53935; font-family: sans-serif; font-size: 22px; margin-left: 5px; }

        /* --- FOOTER (La barre blanche en bas) --- */
        .footer-bar {
            background: white;
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto; /* Pousse le footer tout en bas */
            border-top: 4px solid #ffec00; /* La petite ligne jaune au dessus */
        }

        /* Faux logos pour le footer (en texte stylisé) */
        .sponsor-text {
            color: #110b29;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .sponsor-ugolf { color: #d32f2f; font-weight: 800; margin-right: 5px; }
        
        .footer-logo-club {
            height: 40px;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-area">
            <img src="img/logo mettz.png" alt="Metz Handball" class="logo-img">
        </div>

        <div class="menu-grid">
            <a href="programme.html" class="btn-link">
                <div class="shape bg-white">
                    <span>PROGRAMME DE MATCH</span>
                </div>
            </a>

            <a href="warmup.html" class="btn-link">
                <div class="shape bg-white">
                    <span>JEUX – WARM UP</span>
                </div>
            </a>

            <div class="row-split">
                <a href="mitemps.html" class="btn-link w-60">
                    <div class="shape bg-white">
                        <span>JEU – MI TEMPS</span>
                    </div>
                </a>
                <a href="club.html" class="btn-link w-40">
                    <div class="shape bg-yellow">
                        <span>CLUB</span>
                    </div>
                </a>
            </div>

            <div class="row-split">
                <a href="vote.html" class="btn-link w-35">
                    <div class="shape bg-white">
                        <span>VOTEZ <b class="heart">❤</b></span>
                    </div>
                </a>
                <a href="billetterie.html" class="btn-link w-65">
                    <div class="shape bg-yellow">
                        <span>BILLETTERIE</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div class="footer-bar">
        <div class="sponsor-text">
            <span class="sponsor-ugolf">U</span> GOLF
        </div>

        <div class="sponsor-text" style="font-style:italic; font-weight:900; font-size:18px;">
            K<span style="color:#fbc02d">⚡</span>lizea
        </div>

        <img src="img/logo mettz.png" class="footer-logo-club">
    </div>

</body>
</html>
