<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metz Handball Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

    <style>
        /* --- RESET ET BASE --- */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            /* Couleur bleu nuit profond */
            background-color: #0d0d35; 
            /* Si tu as le motif de fond plus tard : background-image: url('img/pattern.png'); */
            font-family: 'Oswald', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Pousse le footer en bas */
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .main-content {
            width: 100%;
            max-width: 420px; /* Largeur optimale pour mobile */
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px; /* Espacement réduit entre les éléments */
            flex-grow: 1; /* Prend toute la place disponible */
            justify-content: center; /* Centre verticalement */
        }

        /* --- LOGO --- */
        .logo-container {
            margin-bottom: 20px;
            text-align: center;
        }
        .logo-img {
            /* Taille ajustée pour correspondre à l'image */
            width: 140px; 
            height: auto;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        /* --- STYLES DES BOUTONS --- */
        .btn-container {
            width: 100%;
            /* L'inclinaison du conteneur du bouton */
            transform: skewX(-12deg);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
            border-radius: 4px;
            overflow: hidden; /* Important pour le border-radius */
            transition: transform 0.15s, filter 0.15s;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            /* Boutons plus épais (padding vertical plus grand) */
            padding: 22px 10px; 
            text-decoration: none;
            border: none;
            cursor: pointer;
            /* On redresse le texte à l'intérieur */
            transform: skewX(12deg); 
        }

        /* Le texte du bouton */
        .btn span {
            display: block;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.5rem; /* Texte plus gros */
            letter-spacing: 0.5px;
            line-height: 1;
        }

        /* Interaction au clic */
        .btn-container:active {
            transform: skewX(-12deg) scale(0.97) translateY(2px);
            filter: brightness(0.9);
        }

        /* --- COULEURS --- */
        .bg-white .btn { background-color: white; color: #0d0d35; }
        /* Jaune très vif */
        .bg-yellow .btn { background-color: #fff200; color: #0d0d35; }

        /* --- RANGÉES DIVISÉES (FLEXBOX) --- */
        .row {
            display: flex;
            width: 100%;
            gap: 12px; /* Espace entre les boutons d'une même ligne */
        }
        
        /* Ajustement précis des proportions pour coller à l'image */
        .col-left-large { flex: 1.8; } /* ~65% */
        .col-right-small { flex: 1; }   /* ~35% */

        .col-left-small { flex: 1; }    /* ~40% */
        .col-right-large { flex: 1.5; } /* ~60% */

        /* Le coeur rouge */
        .heart { color: #e91e63; margin-left: 8px; font-size: 1.3rem; }

        /* --- FOOTER SPONSORS --- */
        .footer {
            width: 100%;
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between; /* Espacement entre les logos */
            align-items: center;
            margin-top: 20px;
        }
        
        /* Styles temporaires pour les sponsors textuels en attendant les images */
        .sponsor-text {
            color: #0d0d35; font-weight: bold; font-size: 1.1rem;
        }
        .sponsor-logo-small {
            height: 35px;
            width: auto;
        }

    </style>
</head>
<body>

    <div class="main-content">
        <div class="logo-container">
            <img src="img/logo%20mettz.png" alt="Metz Handball" class="logo-img">
        </div>

        <div class="btn-container bg-white">
            <a href="programme.html" class="btn">
                <span>Programme de match</span>
            </a>
        </div>

        <div class="btn-container bg-white">
            <a href="warmup.html" class="btn">
                <span>Jeux – Warm Up</span>
            </a>
        </div>

        <div class="row">
            <div class="btn-container bg-white col-left-large">
                <a href="mitemps.html" class="btn">
                    <span>Jeu – Mi Temps</span>
                </a>
            </div>
            <div class="btn-container bg-yellow col-right-small">
                <a href="club.html" class="btn">
                    <span>Club</span>
                </a>
            </div>
        </div>

        <div class="row">
            <div class="btn-container bg-white col-left-small">
                <a href="vote.html" class="btn">
                    <span>Votez <b class="heart">❤</b></span>
                </a>
            </div>
            <div class="btn-container bg-yellow col-right-large">
                <a href="billetterie.html" class="btn">
                    <span>Billetterie</span>
                </a>
            </div>
        </div>
    </div>

    <div class="footer">
        <span class="sponsor-text" style="color: #e74c3c;">U GOLF</span>
        <span class="sponsor-text">KALIZEA</span>
        <img src="img/logo%20mettz.png" alt="Metz Handball" class="sponsor-logo-small">
    </div>

</body>
</html>
