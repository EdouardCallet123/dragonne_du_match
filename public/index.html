<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metz Handball Menu</title>
    <style>
        /* --- DESIGN GLOBAL --- */
        body {
            margin: 0; padding: 0;
            background-color: #0e0e30; /* Bleu Nuit Metz */
            background-image: url('img/pattern.png'); /* Optionnel: si tu as une image de fond */
            background-size: cover;
            font-family: 'Oswald', 'Segoe UI', sans-serif; /* Police style sport */
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Conteneur principal */
        .app-container {
            width: 100%;
            max-width: 450px; /* Largeur max mobile */
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espace vertical entre les boutons */
        }

        /* Le Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }
        .logo-img {
            width: 120px;
            height: auto;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 18px 10px;
            transform: skewX(-15deg);
            border-radius: 4px;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            text-align: center;
            cursor: pointer;
            margin-left: 10px;
            margin-right: 10px;
            box-sizing: border-box; /* Added this to keep sizes consistent */
        }

        /* Redresser le texte à l'intérieur du bouton incliné */
        .btn span {
            display: block;
            transform: skewX(15deg); /* On inverse l'inclinaison pour le texte */
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        /* Interaction */
        .btn:active {
            transform: skewX(-15deg) scale(0.95);
            filter: brightness(0.9);
        }

        /* --- COULEURS --- */
        .bg-white {
            background-color: white;
            color: #0e0e30;
            border: 3px solid #ffec00; /* Yellow border */
        }

        .bg-yellow {
            background-color: #ffec00;
            color: #0e0e30;
            border: 3px solid white; /* White border */
        }

        /* --- MISE EN PAGE SPÉCIALE (Lignes coupées) --- */
        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        /* Ajustement des largeurs pour ressembler à l'image */
        .w-full { width: 100%; }
        
        /* Ligne Jeu Mi-temps / Club */
        .col-left-large { flex: 2; } /* Prend 2/3 de la place */
        .col-right-small { flex: 1; } /* Prend 1/3 de la place */

        /* Ligne Votez / Billetterie */
        .col-left-small { flex: 1; }
        .col-right-large { flex: 1.5; }

        /* Le coeur rouge */
        .heart { color: #e91e63; }

        /* --- FOOTER --- */
        .footer {
            margin-top: auto;
            padding: 20px;
            background: white;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
        }
        .footer img { height: 30px; opacity: 0.8; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-area">
            <img src="img/logo metz.png" alt="Metz Handball" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
        </div>

        <a href="programme.html" class="btn bg-white w-full">
            <span>Programme de match</span>
        </a>

        <a href="warmup.html" class="btn bg-white w-full">
            <span>Jeux – Warm Up</span>
        </a>

        <div class="row">
            <a href="mitemps.html" class="btn bg-white col-left-large">
                <span>Jeu – Mi Temps</span>
            </a>
            <a href="club.html" class="btn bg-yellow col-right-small">
                <span>Club</span>
            </a>
        </div>

        <div class="row">
            <a href="vote.html" class="btn bg-white col-left-small">
                <span>Votez <b class="heart">❤</b></span>
            </a>
            <a href="billetterie.html" class="btn bg-yellow col-right-large">
                <span>Billetterie</span>
            </a>
        </div>
    </div>

    <div class="footer">
        <span style="color:#0e0e30; font-weight:bold; font-style:italic;">U GOLF</span>
        <span style="color:#0e0e30; font-weight:bold; font-style:italic;">KALIZEA</span>
        <img src="img/logo.png" alt="Logo" style="height:40px;">
    </div>

</body>
</html>
