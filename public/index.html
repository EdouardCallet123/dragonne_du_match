<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metz Handball Menu</title>
    
    <link href="https://fonts.cdnfonts.com/css/lemon-milk" rel="stylesheet">

    <style>
        /* --- DESIGN GLOBAL --- */
        body {
            margin: 0; padding: 0;
            background-color: #0e0e30; 
            background-image: url('img/background.png'); 
            background-size: cover;
            background-position: center;
            font-family: 'LEMON MILK', sans-serif; 
            color: white;   
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Conteneur principal */
        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            flex: 1; 
            gap: 12px; 
        }

        /* Le Logo - FIXE (animation supprimée) */
        .logo-area {
            text-align: center;
            margin-top: 4vh; 
            margin-bottom: 2vh;
        }
        .logo-img {
            width: 120px;
            height: auto;
            max-height: 18vh;
            object-fit: contain;
        }

        /* --- BOUTONS --- */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 2.2vh 10px;
            transform: skewX(-15deg);
            border-radius: 4px;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.4);
            text-align: center;
            cursor: pointer;
            margin: 0 10px;
            box-sizing: border-box;
        }

        .btn span {
            display: block;
            transform: skewX(15deg);
            font-weight: 500; 
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: skewX(-15deg) scale(0.95);
            filter: brightness(0.9);
        }

        .bg-white { background-color: white; color: #0e0e30; border: 3px solid #ffec00; }
        .bg-yellow { background-color: #ffec00; color: #0e0e30; border: 3px solid white; }

        .row { display: flex; justify-content: space-between; gap: 10px; width: 100%; }
        .w-full { width: 100%; }
        .col-left-large { flex: 2; } 
        .col-right-small { flex: 1; }
        .col-left-small { flex: 1; }
        .col-right-large { flex: 1.5; }

        .heart { color: #e91e63; }

        /* --- FOOTER BANDEAU DÉFILANT INFINI --- */
        .footer {
            margin-bottom: 20px;
            background: white;
            width: 90%;
            max-width: 400px;
            height: 55px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            flex-shrink: 0; 
            overflow: hidden; /* Cache ce qui dépasse de la pilule */
            position: relative;
            display: flex;
            align-items: center;
        }

        .scroll-container {
            display: flex;
            width: fit-content;
            animation: scroll-left 15s linear infinite; /* Animation de défilement */
        }

        .scroll-container img {
            height: 30px;
            margin: 0 20px; /* Espace entre les logos */
            flex-shrink: 0;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } /* On décale de la moitié car on a doublé la liste */
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <img src="img/logo metz.png" alt="Metz Handball" class="logo-img">
    </div>

    <div class="app-container">
        <a href="programme.html" class="btn bg-white w-full">
            <span>Programme de match</span>
        </a>

        <a href="warmup.html" class="btn bg-white w-full">
            <span>Jeux – Warm Up</span>
        </a>

        <div class="row">
            <a href="mitemps.html" class="btn bg-white col-left-large">
                <span>Jeu – Mi Temps</span>
            </a>
            <a href="club.html" class="btn bg-yellow col-right-small">
                <span>Club</span>
            </a>
        </div>

        <div class="row">
            <a href="vote.html" class="btn bg-white col-left-small">
                <span>Votez <b class="heart">❤</b></span>
            </a>
            <a href="billetterie.html" class="btn bg-yellow col-right-large">
                <span>Billetterie</span>
            </a>
        </div>
    </div>

    <div class="footer">
        <div class="scroll-container">
            <img src="img/logo metz.png" alt="Logo 1">
            <img src="img/logo_partenaire1.png" alt="Logo 2">
            <img src="img/logo_partenaire2.png" alt="Logo 3">
            <img src="img/logo_partenaire3.png" alt="Logo 4">
            
            <img src="img/logo metz.png" alt="Logo 1">
            <img src="img/logo_partenaire1.png" alt="Logo 2">
            <img src="img/logo_partenaire2.png" alt="Logo 3">
            <img src="img/logo_partenaire3.png" alt="Logo 4">
        </div>
    </div>

</body>
</html>
