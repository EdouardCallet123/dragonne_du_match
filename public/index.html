<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metz Handball Menu</title>
    
    <link href="https://fonts.cdnfonts.com/css/lemon-milk" rel="stylesheet">

    <style>
        /* --- DESIGN GLOBAL --- */
        body {
            margin: 0; padding: 0;
            background-color: #0e0e30; 
            background-image: url('img/background.png'); 
            background-size: cover;
            background-position: center;
            font-family: 'LEMON MILK', sans-serif; 
            color: white;   
            
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ANIMATION ROTATION --- */
        @keyframes slow-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Conteneur principal */
        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
            box-sizing: border-box;
            
            display: flex;
            flex-direction: column;
            justify-content: center; 
            flex: 1; 
            gap: 12px; 
        }

        /* Le Logo avec animation */
        .logo-area {
            text-align: center;
            margin-top: 4vh; /* Un peu plus d'espace en haut */
            margin-bottom: 2vh;
        }
        .logo-img {
            width: 120px; /* Légèrement plus grand pour le centrage visuel */
            height: auto;
            max-height: 18vh;
            object-fit: contain;
            /* L'animation demandée */
            animation: slow-rotate 10s linear infinite;
        }

        /* --- BOUTONS --- */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 2.2vh 10px;
            transform: skewX(-15deg);
            border-radius: 4px;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.4);
            text-align: center;
            cursor: pointer;
            margin: 0 10px;
            box-sizing: border-box;
        }

        .btn span {
            display: block;
            transform: skewX(15deg);
            font-weight: 500; 
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: skewX(-15deg) scale(0.95);
            filter: brightness(0.9);
        }

        /* --- COULEURS --- */
        .bg-white { background-color: white; color: #0e0e30; border: 3px solid #ffec00; }
        .bg-yellow { background-color: #ffec00; color: #0e0e30; border: 3px solid white; }

        /* --- MISE EN PAGE --- */
        .row { display: flex; justify-content: space-between; gap: 10px; width: 100%; }
        .w-full { width: 100%; }
        .col-left-large { flex: 2; } 
        .col-right-small { flex: 1; }
        .col-left-small { flex: 1; }
        .col-right-large { flex: 1.5; }

        .heart { color: #e91e63; }

        /* --- FOOTER FLOTTANT --- */
        .footer {
            margin-bottom: 20px; /* Décolle du bas pour voir le background */
            background: white;
            width: 90%; /* Pas toute la largeur */
            max-width: 400px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50px; /* Coins très arrondis pour l'effet pilule */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            flex-shrink: 0; 
        }
    </style>
</head>
<body>

    <div class="logo-area">
        <img src="img/logo metz.png" alt="Metz Handball" class="logo-img" onerror="this.src='https://via.placeholder.com/100';">
    </div>

    <div class="app-container">
        <a href="programme.html" class="btn bg-white w-full">
            <span>Programme de match</span>
        </a>

        <a href="warmup.html" class="btn bg-white w-full">
            <span>Jeux – Warm Up</span>
        </a>

        <div class="row">
            <a href="mitemps.html" class="btn bg-white col-left-large">
                <span>Jeu – Mi Temps</span>
            </a>
            <a href="club.html" class="btn bg-yellow col-right-small">
                <span>Club</span>
            </a>
        </div>

        <div class="row">
            <a href="vote.html" class="btn bg-white col-left-small">
                <span>Votez <b class="heart">❤</b></span>
            </a>
            <a href="billetterie.html" class="btn bg-yellow col-right-large">
                <span>Billetterie</span>
            </a>
        </div>
    </div>

    <div class="footer">
        <img src="img/logo metz.png" alt="Logo Footer" style="height:30px;">
    </div>

</body>
</html>
