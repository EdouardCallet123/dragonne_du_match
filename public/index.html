<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vote du Match</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; text-align: center; color: #1a1a1a; }
        h1 { margin-bottom: 10px; font-size: 1.4rem; }
        p { color: #666; margin-bottom: 25px; font-size: 0.9rem; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 600px; margin: 0 auto; }
        
        .card {
            background: white; border-radius: 12px; padding: 20px 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent; /* Optim mobile */
        }
        .card:active { transform: scale(0.96); background-color: #e8f5e9; }
        
        .num { font-size: 1.5rem; font-weight: 800; color: #d32f2f; display: block; margin-bottom: 5px; }
        .name { font-weight: 600; font-size: 1rem; }
        
        /* État succès */
        .success-msg { display: none; margin-top: 40px; padding: 20px; background: #e8f5e9; border-radius: 10px; color: #2e7d32; border: 1px solid #c8e6c9; }
        .success-msg h2 { margin: 0 0 10px 0; }

        /* Quand on a voté */
        body.voted .grid { display: none; }
        body.voted .success-msg { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="main">
        <h1>Homme du Match</h1>
        <p>Touchez une carte pour voter.</p>
        <div class="grid" id="grid"></div>
    </div>

    <div class="success-msg">
        <h2>Vote enregistré ! ✅</h2>
        <p>Merci pour votre participation.</p>
    </div>

    <script>
        // CONFIGURATION DES JOUEURS
        const players = [
            { id: 10, name: "Mbappé", num: 10 },
            { id: 7, name: "Griezmann", num: 7 },
            { id: 16, name: "Maignan", num: 16 },
            { id: 4, name: "Upamecano", num: 4 }
        ];

        // LOGIQUE
        const grid = document.getElementById('grid');
        
        // Vérif locale
        if (localStorage.getItem('vote_done_v1')) document.body.classList.add('voted');

        players.forEach(p => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<span class="num">${p.num}</span><span class="name">${p.name}</span>`;
            
            el.onclick = () => {
                // 1. UI Optimiste (Immédiat)
                document.body.classList.add('voted');
                localStorage.setItem('vote_done_v1', 'true');
                
                // 2. Envoi serveur (Silencieux)
                fetch('/api/vote', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ playerId: p.id })
                }); // Pas de .then(), on s'en fiche si ça échoue, l'UX prime.
            };
            grid.appendChild(el);
        });
    </script>
</body>
</html>
