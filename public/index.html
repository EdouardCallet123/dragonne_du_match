<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragonne du Match</title>
    <style>
        /* CSS Optimisé pour chargement instantané */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; text-align: center; color: #212529; }
        
        h1 { margin-bottom: 5px; font-size: 1.6rem; color: #d63384; /* Rose/Rouge Dragonne */ }
        p { color: #6c757d; margin-bottom: 25px; font-size: 0.95rem; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 600px; margin: 0 auto; }
        
        .card {
            background: white; border-radius: 15px; padding: 20px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .card:active { transform: scale(0.96); background-color: #fce4ec; border-color: #d63384; }
        
        .num { font-size: 1.8rem; font-weight: 800; color: #d63384; display: block; margin-bottom: 5px; }
        .name { font-weight: 600; font-size: 1.1rem; }
        
        /* Message de succès */
        .success-msg { display: none; margin-top: 40px; padding: 25px; background: #d1e7dd; border-radius: 15px; color: #0f5132; border: 1px solid #badbcc; }
        .success-msg h2 { margin: 0 0 10px 0; }

        /* État "Voté" */
        body.voted .grid { display: none; }
        body.voted .success-msg { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="main">
        <h1>Dragonne du Match 🔥</h1>
        <p>Qui a été la meilleure aujourd'hui ?</p>
        <div class="grid" id="grid"></div>
    </div>

    <div class="success-msg">
        <h2>Vote enregistré ! ✅</h2>
        <p>Merci pour ton soutien aux Dragonnes.</p>
    </div>

    <script>
        // --- CONFIGURATION DE L'ÉQUIPE ---
        // Tu pourras changer les noms ici avant chaque match
        const players = [
            { id: 1, name: "La Capitaine", num: 10 },
            { id: 2, name: "La Buteuse", num: 9 },
            { id: 3, name: "La Muraille", num: 16 },
            { id: 4, name: "La Flèche", num: 7 },
            { id: 5, name: "Le Roc", num: 4 },
            { id: 6, name: "La Créatrice", num: 8 }
        ];

        const grid = document.getElementById('grid');
        
        // Clé unique pour empêcher de revoter pour CE match
        const STORAGE_KEY = 'dragonne_vote_done_v1';

        // Vérification si déjà voté
        if (localStorage.getItem(STORAGE_KEY)) {
            document.body.classList.add('voted');
        }

        players.forEach(p => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<span class="num">${p.num}</span><span class="name">${p.name}</span>`;
            
            el.onclick = () => {
                // 1. Feedback Visuel Immédiat (UI Optimiste)
                document.body.classList.add('voted');
                localStorage.setItem(STORAGE_KEY, 'true');
                
                // 2. Envoi silencieux au Cloud
                fetch('/api/vote', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ playerId: p.id })
                }).catch(err => console.error("Erreur invisible:", err));
            };
            grid.appendChild(el);
        });
    </script>
</body>
</html>
