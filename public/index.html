<style>
    /* --- DESIGN GLOBAL --- */
    body {
        margin: 0; padding: 0;
        background-color: #0e0e30;
        background-image: url('img/pattern.png'); 
        background-size: cover;
        font-family: 'LEMON MILK', sans-serif; 
        color: white;
        
        /* CORRECTION ICI : Force la hauteur à la taille de l'écran exacte */
        height: 100dvh; 
        width: 100vw;
        overflow: hidden; /* Empêche le scroll */
        
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between; /* Répartit l'espace entre le haut et le bas */
    }

    /* Conteneur principal : Il prend l'espace central */
    .app-container {
        width: 100%;
        max-width: 450px;
        padding: 0 20px; /* On enlève le padding vertical pour laisser Flexbox gérer */
        box-sizing: border-box;
        
        display: flex;
        flex-direction: column;
        justify-content: center; /* Centre les boutons verticalement */
        flex: 1; /* Prend tout l'espace disponible entre le haut et le footer */
        gap: 12px; /* Réduit légèrement l'espace entre les boutons (15px -> 12px) */
    }

    /* Le Logo */
    .logo-area {
        text-align: center;
        /* On réduit les marges fixes pour éviter de manger trop d'espace */
        margin-bottom: 2vh; 
        margin-top: 1vh;
    }
    .logo-img {
        width: 100px; /* Un peu plus petit pour assurer que ça rentre (120 -> 100) */
        height: auto;
        max-height: 15vh; /* Sécurité pour les écrans très plats */
        object-fit: contain;
    }

    /* --- BOUTONS --- */
    .btn {
        display: block;
        text-decoration: none;
        /* Padding dynamique : s'adapte à la hauteur de l'écran */
        padding: 2.2vh 10px; 
        transform: skewX(-15deg);
        border-radius: 4px;
        transition: transform 0.2s, filter 0.2s;
        box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
        text-align: center;
        cursor: pointer;
        margin-left: 10px;
        margin-right: 10px;
        box-sizing: border-box;
        
        /* Sécurité pour éviter que les textes se touchent sur très petit écran */
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Texte à l'intérieur du bouton */
    .btn span {
        display: block;
        transform: skewX(15deg);
        font-weight: 500; 
        text-transform: uppercase;
        font-size: 1rem; /* Réduit légèrement (1.1 -> 1.0) */
        letter-spacing: 1.5px;
    }

    .btn:active {
        transform: skewX(-15deg) scale(0.95);
        filter: brightness(0.9);
    }

    /* --- COULEURS --- */
    .bg-white {
        background-color: white;
        color: #0e0e30;
        border: 3px solid #ffec00;
    }

    .bg-yellow {
        background-color: #ffec00;
        color: #0e0e30;
        border: 3px solid white;
    }

    /* --- MISE EN PAGE --- */
    .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        width: 100%; /* Assure que la ligne prend la largeur */
    }
    
    .w-full { width: 100%; }
    .col-left-large { flex: 2; } 
    .col-right-small { flex: 1; }
    .col-left-small { flex: 1; }
    .col-right-large { flex: 1.5; }

    .heart { color: #e91e63; }

    /* --- FOOTER --- */
    .footer {
        /* Plus de margin-top auto car géré par le body flex */
        padding: 15px;
        background: white;
        width: 100%;
        display: flex;
        justify-content: center; /* Centré au lieu de space-around */
        align-items: center;
        box-sizing: border-box;
        /* S'assure qu'il reste en bas sans être écrasé */
        flex-shrink: 0; 
        height: 60px; /* Hauteur fixe pour éviter les surprises */
    }
    .footer img { height: 30px; opacity: 0.8; }

</style>
