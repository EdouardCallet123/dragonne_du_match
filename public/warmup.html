<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vote pour le Match</title>
    <style>
        /* Configuration globale pour tout faire tenir sur l'écran */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0e0e30;
            color: white;
            overflow-y: auto; /* Permet le scroll si l'écran est vraiment très petit */
        }

        /* Conteneur principal centré */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Commence en haut */
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            text-transform: uppercase;
            font-size: 1.4rem;
            margin: 0 0 15px 0;
            text-align: center;
            color: #ffec00; /* Jaune pour ressortir sur le bleu */
        }

        /* Gestion de l'image pour qu'elle ne mange pas tout l'écran */
        .image-container {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .image-container img {
            max-width: 100%;     /* Ne dépasse pas la largeur */
            max-height: 25vh;    /* Ne prend pas plus de 25% de la hauteur de l'écran !! */
            object-fit: contain; /* Garde les proportions */
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Formulaire */
        form {
            width: 100%;
            max-width: 400px; /* Largeur max sur PC */
            display: flex;
            flex-direction: column;
            gap: 12px; /* Espace entre les champs */
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 2px;
            display: block;
            color: #ddd;
        }

        /* Styles des champs (Inputs et Select) pour écriture facile */
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: white;
            color: #0e0e30;
            font-size: 16px; /* Empêche le zoom automatique sur iPhone */
            font-weight: bold;
            box-sizing: border-box; /* Important pour les padding */
            outline: none;
        }

        /* Focus : petite bordure jaune quand on clique */
        input:focus, select:focus {
            box-shadow: 0 0 0 3px #ffec00;
        }

        /* Bouton Valider unique */
        .btn-submit {
            background: #ffec00;
            color: #0e0e30;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-submit:active {
            transform: scale(0.95);
        }

        /* Lien retour */
        .back-link {
            margin-top: 20px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
        }

        #status-message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Faites votre choix !</h1>
        
        <div class="image-container">
            <img src="img/OU EST LE BALLON-1.png" alt="Où est le ballon ?">
        </div>

        <form id="voteForm" onsubmit="event.preventDefault(); sendVote();">
            
            <div>
                <input type="text" id="pseudo" placeholder="Votre Pseudo" autocomplete="username" required>
            </div>

            <div>
                <input type="email" id="email" placeholder="Votre Email" autocomplete="email" required>
            </div>

            <div>
                <label for="choix">Quelle est la bonne zone ?</label>
                <select id="choix" required>
                    <option value="" disabled selected>Choisir une réponse...</option>
                    <option value="1">Zone 1</option>
                    <option value="2">Zone 2</option>
                    <option value="3">Zone 3</option>
                    <option value="4">Zone 4</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Valider mon vote</button>
        </form>
        
        <p id="status-message"></p>
        <a href="/" class="back-link">⬅ Retour au menu</a>
    </div>

    <script>
        async function sendVote() {
            const pseudo = document.getElementById('pseudo').value;
            const email = document.getElementById('email').value;
            const choixElement = document.getElementById('choix');
            const choice = choixElement.value;
            const status = document.getElementById('status-message');

            // Vérification simple
            if (!pseudo || !email || !choice) {
                status.style.color = "#ffec00";
                status.innerText = "⚠️ Merci de tout remplir !";
                return;
            }

            status.style.color = "white";
            status.innerText = "Envoi en cours...";


            // Si tu utilises des variables d'environnement via un framework, garde :
             const UPSTASH_URL = env.UPSTASH_REDIS_REST_URL;
             const UPSTASH_TOKEN = env.UPSTASH_REDIS_REST_TOKEN;

            const data = {
                pseudo: pseudo,
                email: email,
                choix: choice,
                date: new Date().toISOString()
            };

            try {
                // IMPORTANT : Pour que ça marche en HTML pur, il faut mettre l'URL en dur ou via un backend.
                // Si c'est du HTML statique pur, env.UPSTASH... ne marchera pas.
                // Assure-toi que tes variables sont bien définies.

                const response = await fetch(`${UPSTASH_URL}/lpush/votes/${JSON.stringify(data)}`, {
                    headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` }
                });

                const result = await response.json();

                if (result.error) {
                     throw new Error(result.error);
                }

                status.style.color = "#4ade80"; // Vert clair
                status.innerText = "✅ Vote envoyé avec succès !";
                
                // Désactiver le bouton pour éviter le double vote
                document.querySelector('.btn-submit').disabled = true;
                document.querySelector('.btn-submit').style.opacity = "0.5";

            } catch (error) {
                console.error(error);
                status.style.color = "#ef4444"; // Rouge clair
                status.innerText = "❌ Erreur technique. Réessayez.";
            }
        }
    </script>
</body>
</html>
