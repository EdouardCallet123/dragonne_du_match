<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metz Handball Menu</title>
    <style>
        /* --- IMPORT LEMON MILK --- */
        /* Note: Replace the URL with your actual font file path or CDN link */
        @font-face {
            font-family: 'Lemon Milk';
            src: url('fonts/LemonMilk.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Lemon Milk';
            src: url('fonts/LemonMilk-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        /* --- DESIGN GLOBAL --- */
        body {
            margin: 0; padding: 0;
            background-color: #0e0e30; 
            background-image: url('img/pattern.png'); 
            background-size: cover;
            /* Updated font-family here */
            font-family: 'Lemon Milk', sans-serif; 
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }
        .logo-img {
            width: 120px;
            height: auto;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 18px 10px;
            transform: skewX(-15deg);
            border-radius: 4px;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            text-align: center;
            cursor: pointer;
            margin-left: 10px;
            margin-right: 10px;
            box-sizing: border-box; 
        }

        .btn span {
            display: block;
            transform: skewX(15deg);
            /* Lemon Milk is naturally bold, but we'll ensure it stands out */
            font-weight: bold; 
            text-transform: uppercase;
            font-size: 1.1rem; /* Adjusted slightly as Lemon Milk is wider than Oswald */
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: skewX(-15deg) scale(0.95);
            filter: brightness(0.9);
        }

        /* --- COULEURS AVEC BORDURES --- */
        .bg-white {
            background-color: white;
            color: #0e0e30;
            border: 3px solid #ffec00; 
        }

        .bg-yellow {
            background-color: #ffec00;
            color: #0e0e30;
            border: 3px solid white; 
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        .w-full { width: 100%; }
        .col-left-large { flex: 2; } 
        .col-right-small { flex: 1; }
        .col-left-small { flex: 1; }
        .col-right-large { flex: 1.5; }

        .heart { color: #e91e63; }

        .footer {
            margin-top: auto;
            padding: 20px;
            background: white;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
            /* Applying font to footer text as well */
            font-family: 'Lemon Milk', sans-serif;
        }
        .footer img { height: 30px; opacity: 0.8; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-area">
            <img src="img/logo metz.png" alt="Metz Handball" class="logo-img" onerror="this.style.display='none';">
        </div>

        <a href="programme.html" class="btn bg-white w-full">
            <span>Programme de match</span>
        </a>

        <a href="warmup.html" class="btn bg-white w-full">
            <span>Jeux – Warm Up</span>
        </a>

        <div class="row">
            <a href="mitemps.html" class="btn bg-white col-left-large">
                <span>Jeu – Mi Temps</span>
            </a>
            <a href="club.html" class="btn bg-yellow col-right-small">
                <span>Club</span>
            </a>
        </div>

        <div class="row">
            <a href="vote.html" class="btn bg-white col-left-small">
                <span>Votez <b class="heart">❤</b></span>
            </a>
            <a href="billetterie.html" class="btn bg-yellow col-right-large">
                <span>Billetterie</span>
            </a>
        </div>
    </div>

    <div class="footer">
        <img src="img/logo metz.png" alt="Logo" style="height:40px;">
    </div>

</body>
</html>
