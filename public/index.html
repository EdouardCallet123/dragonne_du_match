<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metz Handball Menu</title>
    
    <link href="https://fonts.cdnfonts.com/css/lemon-milk" rel="stylesheet">

    <style>
        /* --- DESIGN GLOBAL --- */
        body {
            margin: 0; padding: 0;
            background-color: #0e0e30; /* Bleu Nuit Metz */
            /* Assure-toi que l'image est bien dans un dossier 'img' */
            background-image: url('img/pattern.png'); 
            background-size: cover;
            font-family: 'LEMON MILK', sans-serif; 
            color: white;
            
            /* CORRECTION RESPONSIVE : Hauteur écran bloquée */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; /* Empêche le scroll */
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Conteneur principal */
        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 0 20px;
            box-sizing: border-box;
            
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centre verticalement */
            flex: 1; /* Prend tout l'espace libre */
            gap: 12px; /* Espacement flexible */
        }

        /* Le Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 2vh; 
            margin-top: 1vh;
        }
        .logo-img {
            width: 100px;
            height: auto;
            max-height: 15vh;
            object-fit: contain;
        }

        /* --- BOUTONS --- */
        .btn {
            display: block;
            text-decoration: none;
            padding: 2.2vh 10px; /* Padding responsive */
            transform: skewX(-15deg);
            border-radius: 4px;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            text-align: center;
            cursor: pointer;
            margin-left: 10px;
            margin-right: 10px;
            box-sizing: border-box;
            
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Texte à l'intérieur du bouton */
        .btn span {
            display: block;
            transform: skewX(15deg);
            font-weight: 500; 
            text-transform: uppercase;
            font-size: 1rem;
            letter-spacing: 1.5px;
        }

        /* Interaction au clic */
        .btn:active {
            transform: skewX(-15deg) scale(0.95);
            filter: brightness(0.9);
        }

        /* --- COULEURS --- */
        .bg-white {
            background-color: white;
            color: #0e0e30;
            border: 3px solid #ffec00;
        }

        .bg-yellow {
            background-color: #ffec00;
            color: #0e0e30;
            border: 3px solid white;
        }

        /* --- MISE EN PAGE --- */
        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }
        
        .w-full { width: 100%; }
        .col-left-large { flex: 2; } 
        .col-right-small { flex: 1; }
        .col-left-small { flex: 1; }
        .col-right-large { flex: 1.5; }

        .heart { color: #e91e63; }

        /* --- FOOTER --- */
        .footer {
            padding: 15px;
            background: white;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            flex-shrink: 0; 
            height: 60px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-area">
            <img src="img/logo metz.png" alt="Metz Handball" class="logo-img" onerror="this.style.display='none';">
        </div>

        <a href="programme.html" class="btn bg-white w-full">
            <span>Programme de match</span>
        </a>

        <a href="warmup.html" class="btn bg-white w-full">
            <span>Jeux – Warm Up</span>
        </a>

        <div class="row">
            <a href="mitemps.html" class="btn bg-white col-left-large">
                <span>Jeu – Mi Temps</span>
            </a>
            <a href="club.html" class="btn bg-yellow col-right-small">
                <span>Club</span>
            </a>
        </div>

        <div class="row">
            <a href="vote.html" class="btn bg-white col-left-small">
                <span>Votez <b class="heart">❤</b></span>
            </a>
            <a href="billetterie.html" class="btn bg-yellow col-right-large">
                <span>Billetterie</span>
            </a>
        </div>
    </div>

    <div class="footer">
        <img src="img/logo metz.png" alt="Logo Footer" style="height:35px;">
    </div>

</body>
</html>
