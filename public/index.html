<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Dragonnes</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding: 20px; 
            background: #f8f9fa; 
            text-align: center; 
            color: #212529; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 90vh;
        }

        h1 { font-size: 2rem; color: #d63384; margin-bottom: 10px; }
        p { color: #6c757d; margin-bottom: 40px; }

        .menu-container {
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        .btn {
            display: block;
            background: white;
            color: #212529;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 25px 20px;
            margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn:active { transform: scale(0.97); }

        /* Style spécifique pour le bouton VOTE (plus visible) */
        .btn-vote {
            background: #d63384;
            color: white;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.3);
        }
        .btn-vote:active { background: #c2185b; }

        .icon { font-size: 1.5rem; }
        
        .footer { margin-top: 50px; font-size: 0.8rem; color: #adb5bd; }
    </style>
</head>
<body>

    <div class="menu-container">
        <div style="font-size: 3rem; margin-bottom: 10px;">🐉</div>
        <h1>Match Day</h1>
        <p>Bienvenue aux Arènes</p>

        <a href="vote.html" class="btn btn-vote">
            <span>Voter pour la MVP</span>
            <span class="icon">🗳️</span>
        </a>

        <a href="https://metz-handball.com" target="_blank" class="btn">
            <span>Site Officiel</span>
            <span class="icon">🌐</span>
        </a>

        <a href="https://boutique-metz-handball.com" target="_blank" class="btn">
            <span>Boutique</span>
            <span class="icon">🛍️</span>
        </a>
    </div>

    <div class="footer">
        Application non-officielle Dragonne du Match
    </div>

</body>
</html>
